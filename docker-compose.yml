# Entorno local con Docker (ADR 0010). Todo lo que se puede correr en contenedor, corre acá.
#
#   cp .env.example .env
#   docker compose up -d                                 MySQL + API en desarrollo (tsx watch)
#   docker compose --profile herramientas run --rm dbmate up     migraciones de db/migrations
#   docker compose --profile web up -d --build           + app web (build de Flutter servido por Nginx)
#   docker compose --profile herramientas run --rm firmware      compila el firmware y corre sus tests
#
#   API: http://localhost:3000/api/v1/salud   Web: http://localhost:8080   MySQL: localhost:3307
#
# El volumen qr-access-db-data guarda los datos que cargas para revisar: no se baja con -v.
# Para probar migraciones contra una base limpia: docker compose -p qr-access-verif ...
# Flashear el ESP32 por USB y correr la app en un emulador siguen siendo desde el host.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qr_access}
      MYSQL_USER: ${MYSQL_USER:-qr_access}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qr_access}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - qr-access-db-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  dbmate:
    image: amacneil/dbmate:2
    profiles: ["herramientas"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-qr_access}:${MYSQL_PASSWORD:-qr_access}@db:3306/${MYSQL_DATABASE:-qr_access}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
      DBMATE_WAIT: "true"
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: desarrollo
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-qr_access}
      DB_USERNAME: ${MYSQL_USER:-qr_access}
      DB_PASSWORD: ${MYSQL_PASSWORD:-qr_access}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./:/repo
      - api-node-modules:/repo/api/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/salud"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./app
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  firmware:
    build:
      context: ./firmware
    profiles: ["herramientas"]
    volumes:
      - ./firmware:/repo/firmware
      - platformio-cache:/root/.platformio

volumes:
  qr-access-db-data:
  api-node-modules:
  platformio-cache:
