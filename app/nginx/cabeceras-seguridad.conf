# Cabeceras de seguridad de la app web (ADR 0033 §2). Lo incluye cada location que responde archivos
# (`include snippets/...`, relativo al prefijo de nginx), porque en nginx un add_header dentro de un
# location anula los heredados del server. El panel (web/nginx.conf) reenvía /app/ aquí y NO añade
# cabeceras a esa respuesta: así no hay dos CSP. Justificación de cada excepción: docs/gestion/despliegue.md.
#
# Excepciones de la CSP, medidas con el build real de Flutter web 3.47.4 (prueba de nginx y Chrome):
# - 'wasm-unsafe-eval': el renderer canvaskit compila canvaskit.wasm. Sin él, la app no pinta.
#   Permite compilar WebAssembly, no eval de JavaScript.
# - 'sha256-…': el bloque inline `splash-screen-script` de app/web/index.html. Sin el hash no se
#   ejecuta (queda sin `removeSplashFromWeb`). Si ese bloque cambia, cambia el hash: la prueba
#   `bin/verificar-nginx app` lo compara con el build y falla.
# - https://www.gstatic.com/flutter-canvaskit/: el motor carga canvaskit.js y canvaskit.wasm de su CDN
#   (flutter build web no tiene opción para servirlos desde el propio sitio). Sin esta ruta, la app no
#   pinta. Pendiente de decidir: autohospedarlos con web/flutter_bootstrap.js y quitar la excepción.
# - connect-src https://fonts.gstatic.com/s/: fuentes de respaldo del motor para glifos que no están en
#   las fuentes incluidas. Sin esto esos glifos no se ven; el resto de la app funciona.
# - style-src 'unsafe-inline': el motor inserta sus propios estilos en línea. Sin ella el navegador los
#   bloquea y los reporta en consola (la pantalla de ingreso se ve igual). Es excepción de estilo, no de
#   script: no ejecuta código. Pendiente: quitarla si el motor admite nonce o hash para sus estilos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-LEIgqV9+9hWnNcFZ7vYClnAB0Fj6CI1idm4CgGmnQ5g=' https://www.gstatic.com/flutter-canvaskit/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.gstatic.com/flutter-canvaskit/ https://fonts.gstatic.com/s/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
