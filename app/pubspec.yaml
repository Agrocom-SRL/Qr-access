name: agrocom_acceso
description: "AGROCOM Acceso: QR de acceso a puertas"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.3

dependencies:
  animations: ^3.0.0
  country_flags: ^4.1.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  google_nav_bar: ^5.0.7
  intl: ^0.20.3
  lottie: ^3.6.1
  qr: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/imagenes/logo_agrocom.png
    - assets/imagenes/bienvenida_edificio.jpg
    - assets/imagenes/ingreso_acceso.jpg
    - assets/logo/
    - assets/lottie/
    - assets/ilustraciones/
  # IBM Plex Sans (texto) y Mono (PIN, códigos, horas y cifras), empaquetadas para no depender
  # de Google Fonts en tiempo de ejecución (sistema de diseño §2.4). Licencia OFL en assets/fuentes.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fuentes/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fuentes/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexMono-SemiBold.ttf
          weight: 600

# Splash nativo (se regenera con `dart run flutter_native_splash:create`): degradado
# verde de marca con el logo a color sobre su placa blanca. Es el mismo fondo y la misma
# placa que dibuja `SplashPagina`, para que el paso del nativo al animado no se note.
# Android 12+ no admite imagen de fondo: usa el verde de marca y la placa como ícono.
flutter_native_splash:
  background_image: assets/logo/fondo_splash.png
  background_image_dark: assets/logo/fondo_splash_oscuro.png
  image: assets/logo/logo_placa.png
  android_12:
    color: "#007A33"
    color_dark: "#00451C"
    image: assets/logo/logo_placa.png
    icon_background_color: "#007A33"
    icon_background_color_dark: "#00451C"
  web: true

# Ícono de la app (se regenera con `dart run flutter_launcher_icons`): el logo de AGROCOM
# sobre blanco. En Android adaptativo, el primer plano lleva el logo dentro de la zona segura.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icono/icono.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icono/icono_adaptativo.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icono/icono.png
    background_color: "#FFFFFF"
    theme_color: "#007A33"
