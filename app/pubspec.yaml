name: agrocom_acceso
description: "AGROCOM Acceso: QR de acceso a puertas"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.3

dependencies:
  animations: ^3.0.0
  country_flags: ^4.1.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_nav_bar: ^5.0.7
  intl: ^0.20.3
  qr: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/imagenes/logo_agrocom.png
  # IBM Plex Sans (texto) y Mono (PIN, códigos, horas y cifras), empaquetadas para no depender
  # de Google Fonts en tiempo de ejecución (sistema de diseño §2.4). Licencia OFL en assets/fuentes.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fuentes/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fuentes/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexMono-SemiBold.ttf
          weight: 600

# Splash nativo (se regenera con `dart run flutter_native_splash:create`). Los colores
# son los del fondo claro y oscuro del sistema de diseño.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1B1F1C"
  image: assets/imagenes/logo_agrocom.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#1B1F1C"
    image: assets/imagenes/logo_agrocom.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#1B1F1C"
