# Sirve el build web de Flutter bajo /app/ y hace de proxy de /api hacia la API (ADR 0010).
# El dominio (acceso.agrocom.com.bo) y el TLS los pone NPMplus; la raíz del dominio es del
# panel, que reenvía /app/ a este contenedor.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El índice y el service worker no se cachean: así una versión nueva llega enseguida.
    # Ojo: un add_header en un location anula los heredados, por eso se repiten las cabeceras.
    location = /app/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location = /app/flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Entrando directo por este puerto, la raíz lleva a la app.
    location = / {
        return 302 /app/;
    }

    # Rutas de go_router: cualquier ruta desconocida bajo /app/ devuelve la app.
    location /app/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /app/index.html;
    }
}
