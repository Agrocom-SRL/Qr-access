# Sirve el build web de Flutter y hace de proxy de /api hacia la API (ADR 0010).
# TLS y dominio (acceso.agrocom.com.bo) se agregan con el despliegue (D-13).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El índice y el service worker no se cachean: así una versión nueva llega enseguida.
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache" always; }

    # Rutas de go_router: cualquier ruta desconocida devuelve la app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
