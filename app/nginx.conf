# Sirve el build web de Flutter bajo /app/ y hace de proxy de /api hacia la API (ADR 0010).
# El dominio (acceso.agrocom.com.bo) y el TLS los pone NPMplus; la raíz del dominio es del
# panel, que reenvía /app/ a este contenedor. Cabeceras de seguridad (ADR 0033 §2) en
# /etc/nginx/snippets/cabeceras-seguridad.conf, incluido por cada location que responde archivos.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Redirige con ruta relativa: detrás de NPMplus el puerto y el esquema internos no son los públicos.
    absolute_redirect off;

    client_max_body_size 1m;

    # ^~: el prefijo gana a la regex de extensiones de abajo (un /api/x.js va a la API).
    # /api/ nunca se cachea (ADR 0033 §2). La API ya manda `Cache-Control: no-store`; nginx no deduplica
    # add_header, así que se oculta la de la API y se pone una sola: la respuesta trae una cabecera, no dos.
    # Si la API no responde (502/503/504 generados por nginx), el cliente recibe un problema RFC 9457 sin
    # caché, con el mismo formato que la API (@api_caida). Los 503 que la propia API emite no se interceptan.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 = @api_caida;
    }

    location @api_caida {
        include snippets/cabeceras-seguridad.conf;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Vary "Authorization" always;
        return 503 '{"type":"https://acceso.agrocom.com.bo/errores/servicio.no_disponible","title":"servicio.no_disponible","status":503,"code":"servicio.no_disponible"}';
    }

    # Entrando directo por este puerto, la raíz lleva a la app.
    location = / {
        return 302 /app/;
    }

    # Archivos de la app que no existen (con extensión de estático): 404, nunca el índice.
    location ~* ^/app/.+\.(?:js|mjs|css|map|json|bin|wasm|otf|ttf|woff2?|html|webmanifest|png|jpe?g|webp|svg|ico|txt)$ {
        include snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Rutas de go_router: cualquier ruta desconocida bajo /app/ devuelve la app.
    # No se cachea (no-cache): el índice y el service worker llegan con cada versión nueva, y el resto
    # de la app se revalida con su ETag. Un add_header en un location anula los heredados, por eso se incluye el snippet.
    location /app/ {
        include snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }
}
