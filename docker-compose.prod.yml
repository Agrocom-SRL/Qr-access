# Producción en el CT 120 de Proxmox (ADR 0014). Lo levanta `deploy.yml` en el runner `acceso-prod`:
#
#   docker compose -p acceso --env-file /opt/acceso/.env -f docker-compose.prod.yml up -d --build
#
# Los secretos viven en /opt/acceso/.env (fuera del repo, invariante 6); ver docs/gestion/produccion-variables.ejemplo.
# TLS lo termina NPMplus (CT 107): acá todo es HTTP en la red privada 192.168.100.0/24.
# La base NO está en este compose: es la MariaDB 10.11 compartida (DB_HOST en el .env, por IP de la red privada).
# Los archivos viven en un volumen con nombre: nunca se baja con -v.

services:
  dbmate:
    image: amacneil/dbmate:2
    profiles: ["herramientas"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      # No reescribir db/schema.sql en el servidor.
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./db:/db:ro

  # Cliente `mariadb` contra la misma base que usa la API (DB_HOST). Lo usa bin/desplegar para los seeds.
  cliente:
    image: mariadb:10.11
    profiles: ["herramientas"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    entrypoint: ["sh", "-c", 'exec mariadb -h"$$DB_HOST" -P"$$DB_PORT" -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --default-character-set=utf8mb4 "$$MYSQL_DATABASE"']

  api:
    build:
      context: ./api
      target: produccion
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      PIN_PIMIENTA: ${PIN_PIMIENTA}
      JWT_ACCESO_MINUTOS: 15
      JWT_REFRESH_DIAS: 30
      # Detrás de NPMplus y del Nginx de la app: la IP del cliente viene de X-Forwarded-For.
      TRUST_PROXY: "true"
      # Los comprobantes de pago viven en un volumen, fuera del contenedor (ADR 0024).
      ARCHIVOS_RUTA: /archivos
    volumes:
      - archivos:/archivos
    # Sin `ports`: se llega por el Nginx de `app` y de `panel` (mismo origen, sin CORS).

  # Panel del equipo AGROCOM (React): login del super admin. Es la cara de acceso.agrocom.com.bo.
  # NPMplus: acceso.agrocom.com.bo -> http://192.168.100.236:80
  panel:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - api

  # App de usuarios (Flutter web) servida por Nginx bajo /app/, con /api hacia la API. Se usa desde
  # el navegador en https://acceso.agrocom.com.bo/app/: el Nginx del panel reenvía /app/ aquí, así que
  # NPMplus no necesita otra regla. No publica ningún puerto: solo el panel llega a ella, por la red de Docker.
  app:
    build:
      context: ./app
    restart: unless-stopped
    depends_on:
      - api

  # Para ver los datos desde el navegador. No arranca solo: `--profile herramientas up -d phpmyadmin`.
  # Escucha en la red privada; para publicarlo, detrás de NPMplus con Access List y HTTPS.
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["herramientas"]
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      # Servidor fijo: nadie puede apuntar phpMyAdmin a otra base.
      PMA_ARBITRARY: 0
    ports:
      - "8082:80"

volumes:
  archivos:
