# Producción en el CT 120 de Proxmox (ADR 0014). Lo levanta `deploy.yml` en el runner `acceso-prod`:
#
#   docker compose -p acceso --env-file /opt/acceso/.env -f docker-compose.prod.yml up -d --build
#
# Los secretos viven en /opt/acceso/.env (fuera del repo, invariante 6); ver docs/gestion/produccion-variables.ejemplo.
# TLS lo termina NPMplus (CT 107): acá todo es HTTP en la red privada 192.168.100.0/24.
# Los datos viven en volúmenes con nombre: nunca se baja con -v.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Las fechas se guardan en UTC (invariante 7).
      - --default-time-zone=+00:00
    # Sin `ports`: solo la API (y las herramientas) alcanzan la base, por la red interna de Docker.
    volumes:
      - datos-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  dbmate:
    image: amacneil/dbmate:2
    profiles: ["herramientas"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      # No reescribir db/schema.sql en el servidor.
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: produccion
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      PIN_PIMIENTA: ${PIN_PIMIENTA}
      JWT_ACCESO_MINUTOS: 15
      JWT_REFRESH_DIAS: 30
      # Detrás de NPMplus y del Nginx de la app: la IP del cliente viene de X-Forwarded-For.
      TRUST_PROXY: "true"
      # Los comprobantes de pago viven en un volumen, fuera del contenedor (ADR 0024).
      ARCHIVOS_RUTA: /archivos
    volumes:
      - archivos:/archivos
    # Sin `ports`: se llega por el Nginx de `app` y de `panel` (mismo origen, sin CORS).
    depends_on:
      db:
        condition: service_healthy

  # Panel del equipo AGROCOM (React): login del super admin. Es la cara de acceso.agrocom.com.bo.
  # NPMplus: acceso.agrocom.com.bo -> http://192.168.100.236:80
  panel:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - api

  # App de usuarios (Flutter web) servida por Nginx, con /api hacia la API. Mientras las apps no estén
  # en las tiendas, es la forma de usarla desde el navegador, en otro puerto del mismo dominio.
  # NPMplus: <dirección pública de la app> -> http://192.168.100.236:8081
  app:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - api

  # Para ver los datos desde el navegador. No arranca solo: `--profile herramientas up -d phpmyadmin`.
  # Escucha en la red privada; para publicarlo, detrás de NPMplus con Access List y HTTPS.
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["herramientas"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
      # Servidor fijo: nadie puede apuntar phpMyAdmin a otra base.
      PMA_ARBITRARY: 0
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-db:
  archivos:
