; Controlador de puerta de AGROCOM Acceso (ADR 0009). Skill firmware-esp32.
;   pio run              compila para la placa (env esp32)
;   pio test -e native   tests de lib/ en la PC
; También desde Docker: docker compose run --rm firmware (ADR 0010).

[platformio]
default_envs = esp32

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.3.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

; La placa del proyecto es la ESP32-ETH01 (Ethernet por cable + WiFi de respaldo, ADR 0009).
; ACCESO_ETH01 activa la PHY LAN8720 y su asignación de pines (include/pines.h). Sin esa
; bandera (p. ej. un ESP32-DevKitC) el controlador usa solo WiFi.
[env:esp32]
platform = espressif32@^7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
build_flags =
    ${env.build_flags}
    -DACCESO_ETH01

; Compilación de DESARROLLO (mesa de trabajo): habilita ACCESO_DESARROLLO,
; que permite hablar por HTTP plano con la API local y leer include/secretos.h.
; NUNCA se publica ni se flashea en una puerta real: el binario de producción sale
; solo del env `esp32`, que no contiene ninguno de esos dos caminos.
;   pio run -e esp32-dev -t upload
[env:esp32-dev]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DACCESO_DESARROLLO

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Werror
