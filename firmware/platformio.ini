; Controlador de puerta de AGROCOM Acceso (ADR 0009). Skill firmware-esp32.
;   pio run              compila para la placa (env esp32)
;   pio test -e native   tests de lib/ en la PC
; También desde Docker: docker compose run --rm firmware (ADR 0010).

[platformio]
default_envs = esp32

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.3.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

[env:esp32]
platform = espressif32@^7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Werror
