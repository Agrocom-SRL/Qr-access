# Cabeceras de seguridad del panel (ADR 0033 §2). Lo incluye cada location del panel que responde
# archivos propios (con `include`), porque en nginx un add_header dentro de un location anula los
# heredados del server. No van en /api/ ni en /app/: la API y la app web (app/nginx.conf) ponen las suyas,
# y repetirlas daría cabeceras duplicadas.
#
# CSP estricta sin 'unsafe-inline' ni 'unsafe-eval': el build de Vite no genera scripts ni estilos
# en línea (se verifica con `npm run build`). Los estilos de React y de las librerías van por CSSOM
# (propiedades de element.style), que la CSP no bloquea; un style="" en el HTML sí se bloquearía.
# img-src sin data: ni blob: porque el build no referencia imágenes en línea (lo comprueba la prueba de nginx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
