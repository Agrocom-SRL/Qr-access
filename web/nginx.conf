# Sirve el build del panel React y hace de proxy de /api hacia la API (ADR 0010).
# TLS y dominio los pone NPMplus (docs/gestion/despliegue.md), que también fija HSTS y la caché del host.
#
# Reglas de caché y de rutas (ADR 0033 §2):
# - Solo /assets/ se cachea (nombres con hash: nunca cambian). Todo lo demás va con `no-cache`.
# - /api/ no tiene proxy_cache: nunca se cachea aquí. La API responde `Cache-Control: no-store`.
# - Un archivo inexistente con extensión de estático responde 404; nunca el índice del panel.
# - La ruta sin archivo (React Router) devuelve el índice: es el único fallback legítimo.
#
# Los prefijos llevan `^~` para que ganen a la regex de extensiones: sin él, /api/x.js o /app/x.js
# caerían en el 404 del panel en vez de en su destino.
# Caché de /assets/ según la respuesta: 2xx se cachea un año; cualquier otro estado (404) no.
map $status $cache_assets {
    ~^2     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Redirige con ruta relativa: detrás de NPMplus el puerto y el esquema internos no son los públicos.
    absolute_redirect off;

    client_max_body_size 1m;

    # /api/ nunca se cachea (ADR 0033 §2). La API ya manda `Cache-Control: no-store`; nginx no deduplica
    # add_header, así que se oculta la de la API y se pone una sola: la respuesta trae una cabecera, no dos.
    # Si la API no responde (502/503/504 generados por nginx), el cliente recibe un problema RFC 9457 sin
    # caché, con el mismo formato que la API (@api_caida). Los 503 que la propia API emite no se interceptan.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 = @api_caida;
    }

    location @api_caida {
        include snippets/cabeceras-seguridad.conf;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Vary "Authorization" always;
        return 503 '{"type":"https://acceso.agrocom.com.bo/errores/servicio.no_disponible","title":"servicio.no_disponible","status":503,"code":"servicio.no_disponible"}';
    }

    # La app Flutter web vive en /app/ del mismo dominio. Se resuelve en cada petición (resolver de
    # Docker) para que el panel arranque aunque ese contenedor no exista, como en desarrollo.
    # Las cabeceras de la respuesta son las de app/nginx.conf: aquí no se añaden, para no duplicarlas.
    location = /app {
        return 301 /app/;
    }
    location ^~ /app/ {
        resolver 127.0.0.11 valid=10s;
        set $app_web http://app:8080;
        proxy_pass $app_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash en el nombre nunca cambian: se cachean un año. Solo la respuesta 2xx: un 404
    # de /assets/ no se cachea (si no, un archivo que falta quedaría fijo un año en la caché del navegador).
    location ^~ /assets/ {
        include snippets/cabeceras-seguridad.conf;
        add_header Cache-Control $cache_assets always;
        try_files $uri =404;
    }

    # Archivos estáticos sueltos (favicon, manifiestos, código) que no existen: 404, no el índice.
    # Sin caché: lo que está en la raíz puede cambiar entre versiones.
    location ~* \.(?:js|mjs|css|map|json|txt|webmanifest|png|jpe?g|webp|svg|ico|woff2?|ttf)$ {
        include snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Rutas de React Router (y el propio index.html): el índice no se cachea, así una versión nueva
    # llega enseguida. Un add_header en un location anula los heredados, por eso se incluye el snippet.
    location / {
        include snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
