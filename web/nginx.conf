# Sirve el build del panel React y hace de proxy de /api hacia la API (ADR 0010).
# TLS y dominio se agregan con el despliegue (D-13).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash en el nombre nunca cambian: se cachean un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # El índice no se cachea: una versión nueva llega enseguida. Un add_header en un location anula los heredados.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Rutas de React Router: cualquier ruta desconocida devuelve el panel.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
